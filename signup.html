<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up | Jerin Joji</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="navbar"><a class="logo" href="index.html">Jerin<span>.</span></a><nav><a href="index.html">Home</a><a href="about.html">About Me</a><a href="gallery.html">My Gallery</a><a href="contact.html">Contact</a><a class="nav-btn active" href="signup.html">Sign Up</a></nav></header>
<main class="page narrow"><p class="eyebrow">Registration</p><h1>Join my <span>portfolio community.</span></h1><p class="intro">The assignment requires a registration page with at least 15 different fields. This form contains 18.</p>
<form class="signup-form panel">
<div class="form-grid">
<label>Full Name<input type="text" name="fullname"></label><label>Username<input type="text" name="username"></label>
<label>Email<input type="email" name="email"></label><label>Phone Number<input type="tel" name="phone"></label>
<label>Password<input type="password" name="password"></label><label>Confirm Password<input type="password" name="confirm"></label>
<label>Date of Birth<input type="date" name="dob"></label><label>Gender<select name="gender"><option>Select</option><option>Male</option><option>Female</option><option>Other</option></select></label>
<label>Country<input type="text" name="country"></label><label>State<input type="text" name="state"></label>
<label>City<input type="text" name="city"></label><label>PIN Code<input type="number" name="pin"></label>
<label>College/Institution<input type="text" name="college"></label><label>Course<input type="text" name="course"></label>
<label>Year of Study<select name="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></label>
<label>Preferred Role<select name="role"><option>Frontend</option><option>Backend</option><option>Full Stack</option><option>Other</option></select></label>
<label>Profile Photo<input type="file" name="photo"></label><label>Website/Portfolio<input type="url" name="website" placeholder="https://"></label>
</div>
<div class="checks"><label><input type="checkbox" name="updates"> Receive portfolio updates</label><label><input type="radio" name="contact" value="email"> Prefer Email</label><label><input type="radio" name="contact" value="phone"> Prefer Phone</label></div>
<button class="btn" type="submit">Create Account</button>
</form></main><footer>© 2026 Jerin Joji</footer></body></html>
